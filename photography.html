<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Krish Mody | Photography</title>
  <meta name="description" content="Photography by Krish Mody." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/photography.css" />
</head>
<body class="photography-page">
  <header class="site-header">
    <div class="container site-header-inner">
      <div class="identity-row">
        <a href="photography.html" class="site-identity">
          <span class="site-name">Krish Mody</span>
          <span class="site-context">Photography</span>
        </a>

        <nav class="mode-switch" aria-label="Portfolio mode">
          <a href="index.html" class="mode-link">Career</a>
          <a href="photography.html" class="mode-link" aria-current="page">Photography</a>
        </nav>
      </div>

      <nav class="section-nav photography-section-nav" aria-label="Photography sections">
        <ul class="nav-links">
          <li><a href="#work">Work</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="top">
    <section id="work" class="photo-index" aria-labelledby="photo-nameplate">
      <div class="photo-shell">
        <div class="photo-intro">
          <p class="photo-kicker">Photography / Selected work</p>
          <h1 id="photo-nameplate" class="photo-nameplate">Krish<br />Mody</h1>
        </div>

        <div class="series-grid">
          <article class="photo-series">
            <img src="assets/images/photography/alaska/cover-1600.jpg" width="1600" height="1200" alt="" fetchpriority="high" decoding="async" />
            <h2>Alaska</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/canada/cover-1600.jpg" width="1600" height="1200" alt="" loading="lazy" decoding="async" />
            <h2>Canada</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/cities/cover-1600.jpg" width="1600" height="1200" alt="" loading="lazy" decoding="async" />
            <h2>Cities</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/iceland/cover-1600.jpg" width="1600" height="1067" alt="" loading="lazy" decoding="async" />
            <h2>Iceland</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/night/cover-1600.jpg" width="1600" height="1200" alt="" loading="lazy" decoding="async" />
            <h2>Night</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/sf/cover-1600.jpg" width="1600" height="1200" alt="" loading="lazy" decoding="async" />
            <h2>SF</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/seattle/cover-1600.jpg" width="1550" height="1600" alt="" loading="lazy" decoding="async" />
            <h2>Seattle</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/sunsets/cover-1600.jpg" width="1600" height="1195" alt="" loading="lazy" decoding="async" />
            <h2>Sunsets</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/waterfalls/cover-1600.jpg" width="1600" height="1200" alt="" loading="lazy" decoding="async" />
            <h2>Waterfalls</h2>
          </article>

          <article class="photo-series">
            <img src="assets/images/photography/yellowstone/cover-1600.jpg" width="1600" height="1200" alt="" loading="lazy" decoding="async" />
            <h2>Yellowstone</h2>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer photo-footer">
    <div class="photo-shell footer-inner">
      <span>&copy; <span id="year"></span> Krish Mody. All rights reserved.</span>
      <span class="footer-meta">Images may not be licensed or reproduced without written permission.</span>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
